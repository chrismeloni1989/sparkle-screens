<style>
/* Layout: one-screen app. Phone-shaped canvas fills the middle; a dock of tabs + a scrolling control panel sits underneath (beside it on wide screens). Single committed dark "night-light" look so the wallpaper glows. */
:root {
  --bg: #15101c;
  --surface: #211a2b;
  --surface-2: #2d243a;
  --line: #3d3150;
  --fg: #f7effd;
  --muted: #b7a8c8;
  --accent: #ff4fa3;
  --accent-2: #ffd23f;
  --accent-ink: #2b0618;
  --danger: #ff6b6b;
  --glass: rgba(27, 21, 36, .74);
  --glass-ghost: rgba(27, 21, 36, .18);
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; overflow: hidden;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px 6px;
}
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .2px; margin-right: auto; white-space: nowrap; min-width: 0; overflow: hidden; }
.top .btn { flex: none; }
@media (max-width: 400px) { .brand { font-size: 16px; } #app { gap: 6px; padding-block: 4px 2px; } .top .btn.small { padding: 6px 10px; font-size: 13px; } }
.brand svg { width: 22px; height: 22px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .sw:focus-visible, .pick:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.stagewrap { grid-row: 2; grid-column: 1; position: relative; display: flex; align-items: flex-start; justify-content: center; min-height: 0; padding-bottom: 24px; }
#stage { display: block; border-radius: 26px; box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(0,0,0,.55); touch-action: none; background: #000; cursor: grab; }
.hint { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); background: rgba(21,16,28,.82); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.dock { grid-row: 2; grid-column: 1; align-self: end; z-index: 5; display: flex; flex-direction: column; gap: 0; min-height: 0; }
.panel { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; overflow-y: auto; padding: 12px 12px 16px; overscroll-behavior: contain; box-shadow: 0 -10px 30px rgba(0,0,0,.25); transition: background-color .2s ease; }
.dock.ghost .panel { background: var(--glass-ghost); -webkit-backdrop-filter: none; backdrop-filter: none; }
.dock.ghost .panel .sec:not(.active-sec) { opacity: .25; }
.dock.closed .panel { display: none; }
.dock.peek .panel { height: clamp(200px, 38vh, 360px); }
.dock.full .panel { height: 64vh; }
.handle { border: 0; background: transparent; height: 20px; width: 100%; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; padding: 0; }
.handle { height: 24px; }
.handle i { width: 50px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.85); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.handle:focus-visible { outline: 3px solid var(--accent-2); outline-offset: -2px; border-radius: 10px; }
.mini { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(21,16,28,.9); border: 1px solid var(--line); padding: 6px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.45); white-space: nowrap; }
.mini .btn { padding: 8px 13px; }
.tabs { grid-row: 3; grid-column: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.tab { border: 0; background: transparent; border-radius: 12px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--fg); background: var(--surface-2); }
.tab.on svg { color: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 8px; padding-block: 8px; border-bottom: 1px dashed var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h4 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .3px; color: var(--muted); text-transform: uppercase; }
.sec p, .note { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.panel h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--accent-2); border-color: var(--accent-2); color: #2a1d00; }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18); cursor: pointer; padding: 0; position: relative; }
.sw.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent-2); }
.sw.none { background: var(--surface-2); }
.sw.none::after { content: ""; position: absolute; inset: 5px; background: linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%); border-radius: 50%; }
.sw.rainbow { background: conic-gradient(#ff4f4f, #ffd23f, #4fff8a, #4fc3ff, #b44fff, #ff4f4f); }
.sw.custom { overflow: hidden; background: conic-gradient(from 90deg, #fff, #999, #fff); }
.sw.custom input { position: absolute; inset: -8px; width: 46px; height: 46px; opacity: 0; cursor: pointer; }
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
.tile { aspect-ratio: 9 / 16; border-radius: 10px; border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; max-width: 100%; }
.tile.on { border-color: var(--accent-2); }
.tile span { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.slider { display: flex; flex-direction: column; gap: 2px; }
.sl-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); }
.sl-val { font-variant-numeric: tabular-nums; color: var(--fg); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
textarea, input[type=search], input[type=text] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical; }
textarea:focus, input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; }
.pick { border: 0; background: transparent; font-size: 30px; line-height: 1; padding: 6px 0; border-radius: 10px; cursor: pointer; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.pick:hover { background: var(--surface-2); }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats .chip { white-space: nowrap; flex: none; }
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.style-tile { border: 1px solid var(--line); border-radius: 12px; background: #0d0a12; height: 56px; font-size: 22px; cursor: pointer; overflow: hidden; white-space: nowrap; }
.style-tile small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; color: var(--muted); text-shadow: none; -webkit-text-stroke: 0; letter-spacing: .3px; }
.font-chip { font-size: 16px; }
.layer-list { display: flex; flex-direction: column; gap: 6px; }
.layer-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; }
.layer-btn b { font-size: 22px; width: 28px; text-align: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", var(--body); }
.layer-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit-head { display: flex; align-items: center; gap: 8px; }
.edit-head h3 { margin: 0 auto 0 0; }
.big-add { width: 100%; justify-content: center; padding: 14px; font-size: 16px; border-radius: 16px; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.steps b { color: var(--fg); }
a { color: var(--accent-2); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.sheet-back { position: fixed; inset: 0; background: rgba(8,5,12,.65); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 22px 22px 0 0; width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.progress { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.result img, .result video { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 14px; background: #000; }
.preview { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; align-items: center; justify-content: center; }
.preview canvas { display: block; }
.preview .pvnote { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 12px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; }
.gif-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.gif-pick { border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--surface-2); height: 96px; cursor: pointer; }
.gif-pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.giphy-credit { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .4px; }
@media (min-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto minmax(0, 1fr); column-gap: 18px; }
  .top { grid-column: 1 / -1; grid-row: 1; }
  .stagewrap { grid-column: 1; grid-row: 2 / span 2; padding-bottom: 0; align-items: center; }
  .tabs { grid-column: 2; grid-row: 2; }
  .dock { grid-column: 2; grid-row: 3; align-self: stretch; }
  .dock .panel { background: var(--surface); }
  .dock .panel, .dock.closed .panel, .dock.peek .panel, .dock.full .panel { display: block; height: auto; flex: 1; }
  .handle, .mini { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.4 7.3 7.1 2.4-7.1 2.4L12 21l-2.4-7.4-7.1-2.4 7.1-2.4z" fill="var(--accent)"/><path d="M19.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="var(--accent-2)"/></svg>
      Sparkle Screens
    </div>
    <button class="btn ghost small" id="btnNew" type="button">New</button>
    <button class="btn small" id="btnPreview" type="button">Preview</button>
    <button class="btn primary small" id="btnSave" type="button">Save</button>
  </header>
  <main class="stagewrap" id="stagewrap">
    <canvas id="stage" aria-label="Wallpaper design"></canvas>
    <div class="hint" id="hint">Tap a tool below to start. Drag to move, pinch to resize.</div>
    <div class="mini" id="mini" hidden></div>
  </main>
  <section class="dock closed" id="dock">
    <button class="handle" id="handle" type="button" aria-label="Show or hide the tools" aria-expanded="false"><i></i></button>
    <div class="panel" id="panel"></div>
  </section>
  <nav class="tabs" id="tabs" aria-label="Tools"></nav>
</div>
<div id="preview" class="preview" hidden><canvas id="pv"></canvas><div class="pvnote">Tap to go back</div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileGif" accept="image/gif,image/*" hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileVid" accept="video/*" hidden>
